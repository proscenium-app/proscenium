#
# The Contributor License Agreement (CLA.md), asked for on a first pull request
# and required before any is taken in (CONTRIBUTING.md).
#
# CLA Assistant Lite: a signature is a comment on the pull request, and the
# list of who has signed lives in this repository, on the `cla-signatures`
# branch, so no outside service holds it. It runs on `pull_request_target`,
# with the base branch's workflow and never the pull request's code, which is
# what lets it write that list without handing a stranger's change a token.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/proscenium-app/proscenium/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
