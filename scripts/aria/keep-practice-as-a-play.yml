- banner:
  - button "Hide the binder" [pressed]
  - button "Untitled"
  - tablist "What this pane shows":
    - tab "Script"
    - tab "Board"
    - tab "Outline"
    - tab "Cast"
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Hide the inspector" [pressed]
- navigation "Binder":
  - text: Practice Play
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "Practice Play" [level=1]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters": Empty
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes": Empty
    - treeitem "Untitled Rename “Untitled” Actions for “Untitled”" [level=1] [selected]:
      - text: Untitled
      - button "Rename “Untitled”"
      - button "Actions for “Untitled”"
  - button "New"
  - text: at the top level
- main "Play":
  - list "Open in this pane":
    - listitem "Practice Play":
      - button "Practice Play"
    - listitem "Untitled":
      - button "Untitled"
      - button "Close Untitled"
  - button "Add a surface to this pane"
  - textbox "File name"
  - button "Edit Tags"
  - status
  - group "View":
    - button "Page" [pressed]
    - button "Source"
  - toolbar "Formatting":
    - 'button "Paragraph style: Body Text"': Body Text
    - button "Bold"
    - button "Italic"
    - button "Inline code":
      - img
    - button "Link":
      - img
    - button "Bulleted list":
      - img
    - button "Numbered list":
      - img
    - button "Insert table":
      - img
    - button "Insert divider":
      - img
  - paragraph: A note kept beside the script.
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Sheet"
    - tab "Comments" [selected]
  - button "Open as a pane"
  - heading "0 comments" [level=2]
  - 'button "Filter comments: All Comments"': All Comments
  - paragraph:
    - text: No comments yet. Select a line in the script and press ⌘⌥M, or type
    - code: "[["
    - text: where you want one.
  - list
- contentinfo:
  - button "/dev/app-data/tutorials/sessions/<id>/Practice Play"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: Fit width · 84%"': Fit width · 84%
  - button "Zoom in"
- status
- alert
- dialog "Keep as a Play":
  - heading "Keep as a Play" [level=2]
  - paragraph: Keep a complete copy of the practice play in your Plays folder. The practice stays here, and no play is ever replaced.
  - text: Play title
  - textbox "Play title"
  - button "Cancel"
  - button "Keep Copy"
  - status
  - alert
