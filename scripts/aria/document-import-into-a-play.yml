  - heading "MARA" [level=1]
  - paragraph: A hydrologist, early 40s. Measures everything and trusts nothing she can't measure. Came home to bury her mother and stayed to fight the house.
  - paragraph:
    - strong: "Wants:"
    - text: to stop the dripping — the literal pipe, and everything it stands in for.
    - strong: "Fears:"
    - text: that quiet is just absence, not peace.
    - strong: "Voice:"
    - text: short sentences. Precise nouns. Doesn't finish the sentimental ones. WORDS KEPT NOWHERE
