  - text: Practice
  - button "Write Your First Exchange, step 3 of 5. Choose a step": Write Your First Exchange 3 of 5
  - button "Stop Tutorial"
  - paragraph:
    - text: Choose
    - strong: Character
    - text: .
  - button "Show Me"
  - button "Skip Step"
  - button "More Help"
- menu "What this line is":
  - menuitemradio "Act ⌘⌥1"
  - menuitemradio "Scene ⌘⌥2"
  - menuitemradio "Scene Heading ⌘⌥S"
