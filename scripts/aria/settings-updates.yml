  - textbox "Script"
  - 'img "Scene navigation: 2 pages. On screen: <scene>"'
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene"
    - tab "Comments" [selected]
  - button "Open as a pane"
  - heading "0 comments" [level=2]
  - 'button "Filter comments: All Comments"': All Comments
  - paragraph:
    - text: No comments yet. Select a line in the script and press ⌘⌥M, or type
    - code: "[["
    - text: where you want one.
  - list
- contentinfo:
  - button "/dev/sample-vault/The Weight of Water"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: 100%"': 100%
  - button "Zoom in"
- status
- alert
- dialog "Settings":
  - heading "Settings" [level=2]
  - tablist "Settings sections":
    - tab "General"
    - tab "Appearance"
    - tab "Writing"
    - tab "Formats"
    - tab "Keyboard Shortcuts"
    - tab "Help & Feedback"
    - tab "Privacy"
    - tab "Updates" [selected]
    - tab "About"
  - tabpanel "Updates":
    - heading "Updates" [level=3]
    - heading "Automatic updates" [level=4]
    - text: Check for updates automatically
    - switch "Check for updates automatically" [checked]
    - paragraph: Checks when Proscenium opens and once a day, then downloads any new version in the background. Proscenium restarts to install it only when you choose.
    - heading "Update track" [level=4]
    - text: Track
    - 'button "Track: Stable"': Stable
    - paragraph: Each new release.
    - paragraph:
      - button "Have a key?"
    - heading "This version" [level=4]
    - text: Proscenium <version>. This copy can’t check for updates.
    - button "Check Now" [disabled]
    - status
    - paragraph:
      - link "Release notes"
    - paragraph: Updates come from proscenium.ink, or from Proscenium’s releases on GitHub if proscenium.ink doesn’t respond. A check sends the Proscenium and macOS versions, and whether this Mac has Apple silicon or Intel. Each update is verified as coming from Proscenium before it installs.
  - text: Settings are saved on this Mac, not in your plays.
  - button "Done"
  - status
  - alert
