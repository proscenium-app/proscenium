  - button "/dev/sample-vault/The Weight of Water"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: 100%"': 100%
  - button "Zoom in"
- status
- alert
- dialog "Settings":
  - heading "Settings" [level=2]
  - tablist "Settings sections":
    - tab "General"
    - tab "Appearance"
    - tab "Writing" [selected]
    - tab "Formats"
    - tab "Keyboard Shortcuts"
    - tab "Help & Feedback"
    - tab "Privacy"
    - tab "Updates"
    - tab "About"
  - tabpanel "Writing":
    - heading "Writing" [level=3]
    - heading "Script" [level=4]
    - text: Show scene navigation strip
    - switch "Show scene navigation strip" [checked]
    - paragraph: Each scene appears at the bottom of the script, sized by its length in pages. Click one to go to that scene.
    - heading "Spelling" [level=4]
    - text: Check spelling as you type
    - switch "Check spelling as you type" [checked]
    - paragraph: Underlines misspelled words in scripts. Documents and character sheets are checked by macOS, which this switch doesn’t affect.
    - heading "Proscenium dictionary" [level=4]
    - paragraph: Words added here are accepted in every script on this Mac. Documents and character sheets use the macOS dictionary, which is shared with other apps.
    - textbox "Word or name to add"
    - button "Add Word"
    - paragraph: “smokewordle” is already in the dictionary.
    - paragraph: 1 word added.
    - list "Added words":
      - listitem:
        - text: Smokewordle
        - button "Remove “Smokewordle”"
    - heading "Scene statuses" [level=4]
    - paragraph: Offered for scenes in Board, Outline and the Inspector, in this order. Renaming or deleting a status doesn’t change scenes that already have it.
    - list "Statuses, in order":
      - listitem:
        - 'textbox "Status 1 of 4: idea"'
        - button "Move “idea” up" [disabled]
        - button "Move “idea” down"
        - button "Delete “idea”"
      - listitem:
        - 'textbox "Status 2 of 4: drafting"'
        - button "Move “drafting” up"
        - button "Move “drafting” down"
        - button "Delete “drafting”"
      - listitem:
        - 'textbox "Status 3 of 4: revising"'
        - button "Move “revising” up"
        - button "Move “revising” down"
        - button "Delete “revising”"
      - listitem:
        - 'textbox "Status 4 of 4: ready for reading"'
        - button "Move “ready for reading” up"
        - button "Move “ready for reading” down" [disabled]
        - button "Delete “ready for reading”"
    - textbox "New status"
    - button "Add Status" [disabled]
    - paragraph
  - text: Settings are saved on this Mac, not in your plays.
  - button "Done"
  - status
  - alert
