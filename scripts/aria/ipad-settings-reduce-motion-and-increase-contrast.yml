  - 'button "Zoom: Fit width · 94%"': Fit width · 94%
  - button "Zoom in"
- status
- alert
- dialog "Settings":
  - button "Close"
  - heading "Settings" [level=2]
  - tablist "Settings sections":
    - tab "General"
    - tab "Appearance"
    - tab "Writing"
    - tab "Formats"
    - tab "Keyboard Shortcuts"
    - tab "Help & Feedback"
    - tab "Privacy" [selected]
    - tab "Updates"
    - tab "About"
  - tabpanel "Privacy":
    - heading "Privacy" [level=3]
    - heading "Reports" [level=4]
    - text: Share anonymous usage and crash reports
    - switch "Share anonymous usage and crash reports" [checked]
    - paragraph: Counts launches and features used, with the Proscenium and iPadOS versions and chip. Crash reports include stack traces and the kind of failure. Never includes your writing, titles, character names, file names, paths, error messages or memory dumps.
    - paragraph: Turning this off also discards reports that haven’t been sent. Checking for updates is a separate setting, in Updates. Send Feedback works with reports off.
    - button "Read the Privacy Policy"
  - text: Settings are saved on this iPad, not in your plays.
  - status
  - alert
