  - 'button "What this line is: Action"': Action
  - button "Bold": ⌘B
  - button "Italic": ⌘I
  - button "Underline": ⌘U
  - button "Line Break ⇧⏎"
  - button "Page Break ⌘⏎"
  - button "+ Comment ⌘⌥M"
  - button "Comments ⌘⇧C"
