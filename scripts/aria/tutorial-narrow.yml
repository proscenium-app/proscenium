- banner:
  - button "Hide the binder" [pressed]
  - button "Practice Play"
  - tablist "What this pane shows":
    - tab "Script" [selected]
    - tab "Board"
    - tab "Outline"
    - tab "Cast"
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Show the inspector"
- navigation "Binder":
  - text: Practice Play
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "Practice Play Rename “Practice Play” Actions for “Practice Play”" [level=1] [selected]:
      - text: Practice Play
      - button "Rename “Practice Play”"
      - button "Actions for “Practice Play”"
    - group "Scenes in Practice Play":
      - treeitem "SCENE 1 1" [level=2] [selected]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters": Empty
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes": Empty
  - button "New"
  - text: at the top level
- main "Play":
  - 'button "What this line is: Action"': Action
  - button "Bold": ⌘B
  - button "Italic": ⌘I
  - button "Underline": ⌘U
  - button "Line Break ⇧⏎"
  - button "Page Break ⌘⏎"
  - button "+ Comment ⌘⌥M"
  - button "Comments ⌘⇧C"
  - text: Page 1 of 1
  - textbox "Script"
  - 'img "Scene navigation: 1 page. On screen: <scene>"'
- contentinfo:
  - button "/dev/app-data/tutorials/sessions/<id>/Practice Play"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: Fit width · 63%"': Fit width · 63%
  - button "Zoom in"
- status
- alert
- complementary "Tutorial":
  - text: Practice
  - button "Write Your First Exchange, step 1 of 5. Choose a step": Write Your First Exchange 1 of 5
  - button "Stop Tutorial"
  - paragraph: Type MARA, then press ⏎ Return .
  - button "Show Me"
  - button "Skip Step"
  - button "More Help"
