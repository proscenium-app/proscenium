- banner:
  - button "Hide the binder" [pressed]
  - button "All Plays"
  - button "Practice Play"
  - tablist "What this pane shows":
    - tab "Script"
    - tab "Board"
    - tab "Outline"
    - tab "Cast" [selected]
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Hide the inspector" [pressed]
- navigation "Binder":
  - text: Practice Play
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "Front Matter" [expanded] [level=1]
    - group "Front Matter":
      - treeitem "Title Page" [level=2]
      - treeitem "Characters" [level=2]
    - treeitem "Practice Play Rename “Practice Play” Actions for “Practice Play”" [level=1] [selected]:
      - text: Practice Play
      - button "Rename “Practice Play”"
      - button "Actions for “Practice Play”"
    - group "Scenes in Practice Play":
      - treeitem "SCENE 2 1" [level=2]
      - treeitem "SCENE 1 1–2" [level=2] [selected]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters": Empty
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes": Empty
  - button "New"
  - text: at the top level
- separator "Resize the binder"
- main "Play":
  - heading "Cast" [level=1]
  - paragraph: Who speaks, where, and which page of the play names them. Those pages are written in the script’s page view, where they print.
  - group "JUNIPER":
    - text: JUNIPER
    - button "On the Characters page"
    - text: 2 lines · 1 scene Appears in SCENE 1
    - button "Sides (PDF) ↗"
    - button "Add Notes"
  - group "SIMON":
    - text: SIMON Not on a page 1 line · 1 scene Appears in SCENE 1
    - button "Add to Characters Page"
    - button "Leave Off"
    - button "Sides (PDF) ↗"
    - button "Add Notes"
  - heading "Who’s on stage" [level=3]
  - paragraph: A mark where a character speaks. Read across for a part’s shape, down for how full a scene is.
  - table:
    - rowgroup:
      - row "Character SCENE 2 SCENE 1 Scenes":
        - columnheader "Character"
        - columnheader "SCENE 2":
          - button "SCENE 2"
        - columnheader "SCENE 1":
          - button "SCENE 1"
        - columnheader "Scenes"
    - rowgroup:
      - row "JUNIPER silent speaks 1":
        - rowheader "JUNIPER"
        - cell "silent"
        - cell "speaks"
        - cell "1"
      - row "SIMON silent speaks 1":
        - rowheader "SIMON"
        - cell "silent"
        - cell "speaks"
        - cell "1"
    - rowgroup:
      - row "On stage 0 2":
        - rowheader "On stage"
        - cell "0"
        - cell "2"
        - cell
- separator "Resize the inspector"
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene" [selected]
    - tab "Comments"
  - button "Open as a pane"
  - text: Scene 2
  - heading "SCENE 1" [level=2]
  - text: Pages 1–2 · 2 pages · 2 speeches Summary · not printed
  - textbox "Summary"
  - text: Color
  - radiogroup "Scene color":
    - radio "No Color" [checked]
    - radio "Setup"
    - radio "Turns"
    - radio "Interior"
    - radio "Subplot"
    - radio "Revise"
    - radio "Parked"
    - text: no color
  - text: Notes · never prints
  - textbox "Notes"
  - text: On stage JUNIPER 1 SIMON 1 Comments here 0 in this scene
  - button "Show"
  - paragraph: The summary is saved in the script file, though it never prints. Color and notes stay in Proscenium.
- contentinfo:
  - button "/dev/app-data/tutorials/sessions/<id>/Practice Play"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: Fit width · 84%"': Fit width · 84%
  - button "Zoom in"
- status
- alert
- complementary "Tutorial":
  - text: Practice
  - button "Pages Before the Script, step 2 of 4. Choose a step": Pages Before the Script 2 of 4
  - button "Stop Tutorial"
  - paragraph: The Characters page names them now, and prints them.
  - button "Next"
  - button "More Help"
