- dialog "Settings"
  - heading "Settings" [level=2]
  - tablist "Settings sections"
    - tab "General"
    - tab "Appearance"
    - tab "Writing" [selected]
    - tab "Formats"
    - tab "Keyboard Shortcuts"
    - tab "Help & Feedback"
    - tab "Privacy"
    - tab "Updates"
    - tab "About"
  - tabpanel "Writing"
    - heading "Writing" [level=3]
    - heading "SCRIPT" [level=4]
    - none
      - switch "Show scene navigation strip"
    - paragraph
    - heading "COMMENTS" [level=4]
    - none
      - textbox "Your name"
    - paragraph
    - heading "SPELLING" [level=4]
    - none
      - switch "Check spelling as you type"
    - paragraph
    - heading "PROSCENIUM DICTIONARY" [level=4]
    - paragraph
    - form
      - textbox "Word or name to add"
      - button "Add Word" [disabled]
    - paragraph [live=polite]
    - paragraph
  - button "Done"
  - status [live=polite]
  - alert [live=assertive]
