- dialog "Settings"
  - heading "Settings" [level=2]
  - tablist "Settings sections"
    - tab "General" [selected]
    - tab "Appearance" [selected]
    - tab "Writing" [selected]
    - tab "Formats" [selected]
    - tab "Keyboard Shortcuts" [selected]
    - tab "Help & Feedback" [selected]
    - tab "Privacy" [selected]
    - tab "Updates" [selected]
    - tab "About" [selected]
  - tabpanel "Appearance"
    - heading "Appearance" [level=3]
    - heading "TEXT" [level=4]
    - none
      - button "Text size" [haspopup]
    - paragraph
    - heading "ACCENT COLOR" [level=4]
    - radiogroup "Accent color"
      - radio "Gilt" [checked]
      - radio "Velvet" [checked]
      - radio "Ink" [checked]
      - radio "Iris" [checked]
      - radio "Follow Mac" [checked]
    - paragraph
    - heading "LIGHT AND DARK" [level=4]
    - button "Appearance: Follow Mac" [haspopup]
    - paragraph
  - button "Done"
  - status [live=polite]
  - alert [live=assertive]
