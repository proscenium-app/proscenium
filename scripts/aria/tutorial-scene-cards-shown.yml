- banner:
  - button "Hide the binder" [pressed]
  - button "Practice Play"
  - tablist "What this pane shows":
    - tab "Script"
    - tab "Board" [selected]
    - tab "Outline"
    - tab "Cast"
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Hide the inspector" [pressed]
- navigation "Binder":
  - text: Practice Play
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "Practice Play Rename “Practice Play” Actions for “Practice Play”" [level=1] [selected]:
      - text: Practice Play
      - button "Rename “Practice Play”"
      - button "Actions for “Practice Play”"
    - group "Scenes in Practice Play":
      - treeitem "SCENE 1 1–2" [level=2]
      - treeitem "SCENE 2 2" [level=2] [selected]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters": Empty
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes": Empty
  - button "New"
  - text: at the top level
- main "Play":
  - group "SCENE 1":
    - button "SCENE 1"
    - text: Pages 1–2
    - textbox "Summary — SCENE 1"
    - group: Details
    - 'button "Scene status — SCENE 1: No Status"': No Status
    - button "Move earlier — SCENE 1" [disabled]
    - button "Move later — SCENE 1"
  - group "SCENE 2":
    - button "SCENE 2"
    - text: Page 2
    - textbox "Summary — SCENE 2"
    - group: Details
    - 'button "Scene status — SCENE 2: No Status"': No Status
    - button "Move earlier — SCENE 2"
    - button "Move later — SCENE 2" [disabled]
  - button "New Scene"
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene"
    - tab "Comments" [selected]
  - button "Open as a pane"
  - heading "0 comments" [level=2]
  - 'button "Filter comments: All Comments"': All Comments
  - paragraph:
    - text: No comments yet. Select a line in the script and press ⌘⌥M, or type
    - code: "[["
    - text: where you want one.
  - list
- contentinfo:
  - button "/dev/app-data/tutorials/sessions/<id>/Practice Play"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: Fit width · 84%"': Fit width · 84%
  - button "Zoom in"
- status
- alert
- complementary "Tutorial":
  - text: Practice
  - button "Arrange Scenes on the Board, step 2 of 5. Choose a step": Arrange Scenes on the Board 2 of 5
  - button "Stop Tutorial"
  - paragraph: A new scene, on the Board and in the script.
  - button "Next"
  - button "More Help"
