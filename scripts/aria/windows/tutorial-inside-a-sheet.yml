- alert
- dialog "Export PDF":
  - heading "Export PDF" [level=2]
  - text: Practice Play File type
  - 'button "File type — what the export writes: PDF"': PDF
  - text: Part
  - 'button "Part — what to export: Whole Script"': Whole Script
  - text: Pages
  - textbox "Pages to export"
  - text: The whole script — 2 pages
  - list "Pages":
    - listitem:
      - button "Title Page": PRACTICE PLAY
      - checkbox "Include Title Page" [checked]
      - text: Title Page
    - listitem:
      - button "Characters": CHARACTERS SOREL JUDITH
      - checkbox "Include Characters" [checked]
      - text: Characters
    - listitem:
      - button "Setting": SETTING
      - checkbox "Include Setting" [checked]
      - text: Setting
    - listitem:
      - button "Page 1": SCENE 2 SCENE 1 SOREL I wish she hadn't sent me the beastly book.
      - checkbox "Include page 1" [checked]
      - text: "1"
    - listitem:
      - button "Page 2": 2. SIMON Only by a minute.
      - checkbox "Include page 2" [checked]
      - text: "2"
  - region "Preview of what will export": PRACTICE PLAY CHARACTERS SOREL JUDITH SETTING SCENE 2 SCENE 1 SOREL I wish she hadn't sent me the beastly book.
  - button "Previous page" [disabled]: ◀
  - text: Title Page · sheet 1 of 5
  - button "Next page": ▶
  - group "Include":
    - text: Include
    - checkbox "Title Page" [checked]
    - text: Title Page
    - checkbox "Characters" [checked]
    - text: Characters
    - checkbox "Setting" [checked]
    - text: Setting
  - checkbox "Anonymous copy"
  - text: "Anonymous copy For a blind reading: no name or contact details. Language"
  - textbox "Play language"
  - text: American spelling, screen readers and PDFs. Saved for this play. Pages keep their own numbers — 7–10 prints as 7–10.
