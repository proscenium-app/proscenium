    - treeitem "Notes" [expanded] [level=1]
    - group "Notes": Empty
  - button "New"
  - text: at the top level
- main "Play":
  - 'button "What this line is: Action" [expanded]': Action
  - button "Bold": Ctrl+B
  - button "Italic": Ctrl+I
  - button "Underline": Ctrl+U
  - button "Line Break Shift+Enter"
  - button "Page Break Ctrl+Enter"
  - button "+ Comment Ctrl+M"
  - button "Comments Ctrl+Shift+M"
  - text: Page 1 of 1
  - textbox "Script"
  - 'img "Scene navigation: 1 page. On screen: <scene>"'
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene" [selected]
    - tab "Comments"
  - button "Open as a pane"
  - text: Scene 1
  - heading "SCENE 1" [level=2]
  - text: Page 1 · 1 page · 1 speeches Summary · not printed
  - textbox "Summary"
  - text: Status
  - 'button "Scene status: No Status"': No Status
  - text: Label
  - textbox "Label"
  - text: Colour
  - radiogroup "Card colour":
    - radio "Unmarked" [checked]
    - radio "Setup"
    - radio "Turns"
    - radio "Interior"
    - radio "Subplot"
    - radio "Revise"
    - radio "Parked"
    - text: unmarked
  - text: Board note · never prints
  - textbox "Board note"
  - text: On stage MARA 1 Comments here 0 in this scene
  - button "Show"
  - paragraph: The synopsis is part of the script. The rest is card metadata.
- contentinfo:
  - button "<app data>\\tutorials\\sessions\\<id>\\Practice Play"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: Fit width · 82%"': Fit width · 82%
  - button "Zoom in"
- status
- alert
