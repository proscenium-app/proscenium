  - text: Page 2 · 1 page · 3 speeches Summary · not printed
  - textbox "Summary"
  - text: Status
  - 'button "Scene status: idea"': idea
  - text: Label
  - textbox "Label"
  - text: Colour
  - radiogroup "Card colour":
    - radio "Unmarked" [checked]
    - radio "Setup"
    - radio "Turns"
    - radio "Interior"
    - radio "Subplot"
    - radio "Revise"
    - radio "Parked"
