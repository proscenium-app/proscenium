        - separator "2 unchanged elements not shown. ACT ONE · SCENE 1"
        - text: "Mara, alone before dawn, can't stop the dripping. Jonah arrives uninvited. AT RISE: A kitchen, just before dawn. A tap drips. MARA stands at the sink in her coat, as if she never sat down. MARA The pipe's been crying all night."
        - insertion: Like it knows.
        - text: She turns off the tap. It keeps dripping. JONAH (from the doorway, half asleep) You and that
        - deletion: pipe
        - text: . MARA You weren't supposed to come
        - insertion: back
        - text: . SCENE 2 Morning. The truce that isn't one. Light now. The coats are off. Coffee between them, untouched.
        - separator "10 unchanged elements not shown"
