- banner:
  - button "Hide the binder" [pressed]
  - button "Practice Play"
  - tablist "What this pane shows":
    - tab "Script"
    - tab "Board"
    - tab "Outline"
    - tab "Cast & Pages" [selected]
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Hide the inspector" [pressed]
- navigation "Binder":
  - text: Practice Play
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "Practice Play Rename “Practice Play” Actions for “Practice Play”" [level=1] [selected]:
      - text: Practice Play
      - button "Rename “Practice Play”"
      - button "Actions for “Practice Play”"
    - group "Scenes in Practice Play":
      - treeitem "SCENE 2 1" [level=2]
      - treeitem "SCENE 1 1–2" [level=2] [selected]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters": Empty
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes": Empty
  - button "New"
  - text: at the top level
- main "Play":
  - heading "Cast & Pages" [level=1]
  - paragraph: Every page before the script, in the order they print, and the cast.
  - navigation "Pages before the script":
    - button "Title Page"
    - button "Characters"
    - button "Opening Notes"
    - button "Production Notes"
    - button "Cast"
  - region "Title Page":
    - heading "Title Page" [level=2]
    - text: Title
    - textbox "Title"
    - text: Credit
    - textbox "Credit"
    - text: Authors
    - textbox "Authors"
    - text: Contact
    - textbox "Contact"
    - text: Draft date
    - textbox "Draft date"
    - text: Write the title page freely
    - switch "Write the title page freely"
  - heading "Characters Page" [level=2]
  - paragraph: The page your readers will see. A name in bold starts a character’s line, and the cast list below follows it, as it follows the list.
  - group "Printed characters page":
    - toolbar "Formatting":
      - 'button "Paragraph style: Body Text"': Body Text
      - button "Bold"
      - button "Italic"
      - 'button "Text alignment: Align Left"': Align Left
      - button "Bulleted list":
        - img
      - button "Numbered list":
        - img
    - heading "Characters" [level=1]
    - paragraph:
      - strong: JUNIPER
    - paragraph:
      - strong: SIMON
    - paragraph:
      - emphasis: The Blisses, and the guests they asked for the weekend.
  - group: Page Options
  - region "Opening Notes":
    - heading "Opening Notes" [level=2]
    - switch "Include opening notes"
    - paragraph: An optional page for setting, time, place, a dedication or other notes, with headings of your own.
  - region "Production Notes":
    - heading "Production Notes" [level=2]
    - switch "Include production notes"
    - paragraph: "An optional page for whoever stages the play: casting and doubling, the set, music, or how the text marks overlapping lines. It prints under the heading PRODUCTION NOTES, just before the script."
  - heading "Cast Tools" [level=2]
  - paragraph: Names, private notes, appearances and sides.
  - group "JUNIPER":
    - text: JUNIPER
    - textbox "Name — JUNIPER"
    - textbox "Description — JUNIPER"
    - button "Remove JUNIPER"
    - button "Move JUNIPER up" [disabled]
    - button "Move JUNIPER down"
    - text: 2 lines · 1 scene Appears in SCENE 1
    - button "Sides (PDF) ↗"
    - button "Add Notes"
  - group "SIMON":
    - text: SIMON
    - textbox "Name — SIMON"
    - textbox "Description — SIMON"
    - button "Remove SIMON"
    - button "Move SIMON up"
    - button "Move SIMON down" [disabled]
    - text: 1 line · 1 scene Appears in SCENE 1
    - button "Sides (PDF) ↗"
    - button "Add Notes"
  - button "Add Character"
  - heading "Who’s on stage" [level=3]
  - paragraph: A mark where a character speaks. Read across for a part’s shape, down for how full a scene is.
  - table:
    - rowgroup:
      - row "Character SCENE 2 SCENE 1 Scenes":
        - columnheader "Character"
        - columnheader "SCENE 2":
          - button "SCENE 2"
        - columnheader "SCENE 1":
          - button "SCENE 1"
        - columnheader "Scenes"
    - rowgroup:
      - row "JUNIPER silent speaks 1":
        - rowheader "JUNIPER"
        - cell "silent"
        - cell "speaks"
        - cell "1"
      - row "SIMON silent speaks 1":
        - rowheader "SIMON"
        - cell "silent"
        - cell "speaks"
        - cell "1"
    - rowgroup:
      - row "On stage 0 2":
        - rowheader "On stage"
        - cell "0"
        - cell "2"
        - cell
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene" [selected]
    - tab "Comments"
  - button "Open as a pane"
  - text: Scene 2
  - heading "SCENE 1" [level=2]
  - text: Pages 1–2 · 2 pages · 3 speeches Summary · not printed
  - textbox "Summary"
  - text: Color
  - radiogroup "Scene color":
    - radio "No Color" [checked]
    - radio "Setup"
    - radio "Turns"
    - radio "Interior"
    - radio "Subplot"
    - radio "Revise"
    - radio "Parked"
    - text: no color
  - text: Notes · never prints
  - textbox "Notes"
  - text: On stage JUNIPER 2 SIMON 1 Comments here 0 in this scene
  - button "Show"
  - paragraph: The synopsis is part of the script. The rest is card metadata.
