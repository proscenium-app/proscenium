  - region "What Recover would change": "Title: The Weight of Water Credit: a play by Author: A. Playwright Draft date: 2026-06-18 Contact: playwright@example.com Setting: A coastal kitchen, and the rooms of memory around it. Time: The last night of winter. Characters: MARA — a hydrologist, 40s JONAH — her brother, 30s The tide came in somewhere else. # ACT ONE ## SCENE 1 = Mara, alone before dawn, can't stop the dripping. Jonah arrives uninvited. AT RISE: A kitchen, just before dawn. A tap drips. MARA stands at the sink in her coat, as if she never sat down. MARA The pipe's been crying all night. She turns off the tap. It keeps dripping. JONAH (from the doorway, half asleep) You and that pipe. MARA You weren't supposed to come. ## SCENE 2 = Morning. The truce that isn't one. Light now. The coats are off. Coffee between them, untouched. JONAH Mom left you the house. She left me the water. > BLACKOUT. # ACT TWO ## SCENE 1 = Three months later. The kitchen is half-packed. Boxes everywhere. The tap is gone, capped with a brass plug. MARA It's quiet now. I keep listening for it. Waves. The sea came in."
