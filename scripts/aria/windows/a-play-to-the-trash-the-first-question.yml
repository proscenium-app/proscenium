- dialog "Move “Ashes in Spring” to the Recycle Bin?":
  - heading "Move “Ashes in Spring” to the Recycle Bin?" [level=2]
  - heading "What goes" [level=3]
  - paragraph: "The whole play: its folder “Ashes in Spring” in your Plays folder, with every script, page, file and card in it."
  - paragraph: If your Plays folder syncs, as iCloud Drive, OneDrive or Dropbox do, the play leaves your other devices too, and comes back to them when you put it back.
  - paragraph: Its saved versions stay on this PC, and are there again once the play is back.
  - heading "How to get it back" [level=3]
  - list:
    - listitem: Open the Recycle Bin on the desktop.
    - listitem: Select the folder “Ashes in Spring”.
    - listitem: Choose Restore from its right-click menu.
  - paragraph: Nothing is erased until the Recycle Bin is emptied.
  - button "Cancel"
  - button "Continue…"
  - status
  - alert
