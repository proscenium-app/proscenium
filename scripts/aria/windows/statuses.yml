  - heading "1953 North Sea Flood" [level=1]
  - paragraph: Reference material for the family's relationship to the marsh and "the water."
  - paragraph: The night of 31 January 1953, a storm tide overwhelmed sea defenses around the North Sea. Water came in the dark, through the floors, before anyone decided anything. People woke already inside it.
  - paragraph: "Useful for the play's central image: water as the thing that arrives without being invited and stays without being asked — same shape as grief, same shape as a brother in the doorway. Mara measures it now for a living; she's been trying to put a number on what once just came in under the door."
  - blockquote:
    - paragraph: A reference file like a PDF or image would sit beside this note untouched; the app opens it read-only.
