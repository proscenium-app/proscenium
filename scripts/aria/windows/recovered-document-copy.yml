          - button "Next change"
        - button "Revert…"
        - region "What changed in Characters/Mara.md":
          - paragraph: The details at the top changed as well. Line by Line shows them.
          - group "Mara.md, with its changes marked":
            - heading "MARA" [level=1]:
              - deletion: MARA
            - paragraph:
              - deletion: A hydrologist, early 40s. Measures everything and trusts nothing she can't measure. Came home to bury her mother and stayed to fight the house.
            - paragraph:
              - strong:
                - deletion: "Wants:"
              - deletion: to stop the dripping — the literal pipe, and everything it stands in for.
              - strong:
                - deletion: "Fears:"
              - deletion: that quiet is just absence, not peace.
              - strong:
                - deletion: "Voice:"
              - deletion: short sentences. Precise nouns. Doesn't finish the sentimental ones.
            - heading "Changed elsewhere" [level=1]:
              - insertion: Changed elsewhere
            - paragraph
