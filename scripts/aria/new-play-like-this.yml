- banner:
  - button "Help & Tutorials"
  - button "Feedback"
- main:
  - heading "sample-vault" [level=1]
  - textbox "Search plays"
  - button "New Play"
  - button "Import a Draft…"
  - heading "Plays" [level=2]
  - paragraph: 5 plays · sample-vault
  - paragraph: Your plays live in a folder on this Mac only. They will not appear on other devices.
  - table "Plays":
    - 'row "Evening Ferry 1 page Status for Evening Ferry: idea Today, <time> More actions for “Evening Ferry”"':
      - cell "Evening Ferry":
        - button "Evening Ferry"
        - textbox "Logline for Evening Ferry"
      - cell "1 page"
      - 'cell "Status for Evening Ferry: idea"':
        - 'button "Status for Evening Ferry: idea"': idea
      - cell "Today, <time>"
      - cell "More actions for “Evening Ferry”":
        - button "More actions for “Evening Ferry”"
    - 'row "Evening Ferry copy 1 page Status for Evening Ferry copy: idea Today, <time> More actions for “Evening Ferry copy”"':
      - cell "Evening Ferry copy":
        - button "Evening Ferry copy"
        - textbox "Logline for Evening Ferry copy"
      - cell "1 page"
      - 'cell "Status for Evening Ferry copy: idea"':
        - 'button "Status for Evening Ferry copy: idea"': idea
      - cell "Today, <time>"
      - cell "More actions for “Evening Ferry copy”":
        - button "More actions for “Evening Ferry copy”"
    - 'row "Lamplight 1 page Status for Lamplight: idea Today, <time> More actions for “Lamplight”"':
      - cell "Lamplight":
        - button "Lamplight"
        - textbox "Logline for Lamplight"
      - cell "1 page"
      - 'cell "Status for Lamplight: idea"':
        - 'button "Status for Lamplight: idea"': idea
      - cell "Today, <time>"
      - cell "More actions for “Lamplight”":
        - button "More actions for “Lamplight”"
    - 'row "The Lighthouse 1 page Status for The Lighthouse: drafting <date and time> More actions for “The Lighthouse”"':
      - cell "The Lighthouse":
        - button "The Lighthouse"
        - textbox "Logline for The Lighthouse"
      - cell "1 page"
      - 'cell "Status for The Lighthouse: drafting"':
        - 'button "Status for The Lighthouse: drafting"': drafting
      - cell "<date and time>"
      - cell "More actions for “The Lighthouse”":
        - button "More actions for “The Lighthouse”"
    - 'row "The Weight of Water A flooded house, a brother who came back, and a plug nobody will pull. 2 pages Status for The Weight of Water: drafting <date and time> More actions for “The Weight of Water”"':
      - cell "The Weight of Water A flooded house, a brother who came back, and a plug nobody will pull.":
        - button "The Weight of Water"
        - textbox "Logline for The Weight of Water"
      - cell "2 pages"
      - 'cell "Status for The Weight of Water: drafting"':
        - 'button "Status for The Weight of Water: drafting"': drafting
      - cell "<date and time>"
      - cell "More actions for “The Weight of Water”":
        - button "More actions for “The Weight of Water”"
    - row "Play Progress Status Modified Actions":
      - columnheader "Play"
      - columnheader "Progress"
      - columnheader "Status"
      - columnheader "Modified"
      - columnheader "Actions"
- contentinfo:
  - button "/dev/sample-vault"
- status
- alert
- dialog "New Play Like This":
  - heading "New Play Like This" [level=2]
  - paragraph: A new play with the format, pages and folders of “Evening Ferry”, and none of its writing.
  - text: Name
  - textbox "Name"
  - paragraph
  - button "Cancel"
  - button "Create Play" [disabled]
  - status
  - alert
