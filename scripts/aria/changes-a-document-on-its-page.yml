        - button "Newer" [disabled]
        - button "Older"
        - text: Mara 20 words added and 8 cut
        - group "Changes on this page":
          - button "Previous change" [disabled]
          - text: 5 changes
          - button "Next change"
        - button "Revert…"
        - region "What changed in Characters/Mara.md":
          - group "Mara.md, with its changes marked":
            - heading "MARA" [level=1]
            - paragraph: A hydrologist, early 40s. Measures everything and trusts nothing she can't measure. Came home to bury her mother and stayed to fight the house.
            - paragraph:
              - strong: "Wants:"
              - text: to stop the dripping — the literal pipe, and everything it stands in for.
              - strong:
                - deletion: "Fears:"
              - deletion: that quiet is just absence, not peace.
              - strong: "Voice:"
              - text: short sentences. Precise nouns. Doesn't finish the sentimental ones.
            - heading "Wounds" [level=2]:
              - insertion: Wounds
            - list:
              - listitem:
                - text: •
                - paragraph:
                  - insertion: Her mother left the water to Jonah.
              - listitem:
                - text: •
                - paragraph:
                  - insertion: She never learned to swim.
                - list:
                  - listitem:
                    - text: ◦
                    - paragraph:
                      - insertion: Her father drowned when she was nine.
      - listitem:
        - button "Changed somewhere else <time> Jonah · <a burst of saves>"
      - listitem:
        - button "Changed somewhere else <time> The Weight of Water · <a burst of saves>"
      - listitem:
        - button "Changed somewhere else <time> The Weight of Water · <a burst of saves>"
      - listitem:
        - 'button "You wrote <time> The Weight of Water ACT TWO: SCENE 1 1 word added"'
