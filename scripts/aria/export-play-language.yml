    - listitem:
      - button "Characters page": CHARACTERS MARA — a hydrologist, 40s JONAH — her brother, 30s
      - checkbox "Include characters page" [checked]
      - text: Characters
    - listitem:
      - button "Opening notes": SETTING A coastal kitchen, and the rooms of memory around it. TIME The last night of winter.
      - checkbox "Include opening notes" [checked]
      - text: Notes
    - listitem:
      - button "Page 1": "1. ACT ONE SCENE 1 AT RISE: A kitchen, just before dawn. A tap drips. MARA stands at the sink in her coat, as if she never sat down. MARA The pipe's been crying all night. She turns off the tap. It keeps dripping. JONAH (from the doorway, half asleep) You and that pipe. MARA You weren't supposed to come. SCENE 2 Light now. The coats are off. Coffee between them, untouched. JONAH Mom left you the house. She left me the water. BLACKOUT."
      - checkbox "Include page 1" [checked]
      - text: "1"
    - listitem:
      - button "Page 2": 2. ACT TWO SCENE 1 Boxes everywhere. The tap is gone, capped with a brass plug. MARA It's quiet now. I keep listening for it.
      - checkbox "Include page 2" [checked]
      - text: "2"
