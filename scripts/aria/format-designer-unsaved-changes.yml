  - text: Format sampler · 4 pages Preview with This Play
  - switch "Preview with This Play"
  - 'region "Preview: the format sampler, 4 pages"':
    - 'img "Page 1 of 4. Act centered. Scene centered. Scene Heading centered. Action at 3.8 inches from the left edge. Character at 4.3 inches from the left edge. Dialogue at 1.3 inches from the left edge. Parenthetical at 3.3 inches from the left edge. Lyric at 4.5 inches from the left edge. Transition right-aligned. Footer center: 1."': 1 ACT ONE SCENE 1 A REHEARSAL ROOM. LATE. A long table covered in scripts. A single work light. NELL, the stage manager, sits with the prompt book open. ARLO paces with a coffee he has forgotten to drink. ARLO It's the second act. It has always been the second act. NELL (not looking up) It's the first act. You just don't notice it until the second. ARLO (O.S.) I'm going to get more coffee. NELL You have coffee. ARLO I have cold coffee. NELL Cold coffee is still coffee. Oh, the ghost light burns for nobody, it burns so the stage can see. LIGHTS SHIFT. SCENE 2 The same room. The table is cleared. NELL stands, headset on, calling the whole show from memory. NELL Standby lights forty-two. Standby sound G. Standby fly nine, the drop.
    - 'img "Page 2 of 4. Header right: I-2-2. Character at 4.3 inches from the left edge. Dialogue at 1.3 inches from the left edge. Continues NELL (CONT''D). Footer center: 2."': I-2-2 2 NELL (CONT'D) Lights forty-two, go. Sound G, go. Fly nine, go. Thank you. Hold, please. Somebody find the ghost light. No, not that one. The real one. Standby lights forty-three. Standby the revolve. Crew, clear the revolve, please. Clear? Thank you. Lights forty-three, go. Revolve, go. Watch the doorway. Watch it. Good. Standby lights forty-four. Standby the rain. Rain is a go when he says the word umbrella. He did not say umbrella. He said parasol. We will talk about parasol at notes. Rain, go. Rain, stop. That was the hose. Thank you, Dev. Standby lights forty-five through fifty. Those are a sequence. Take them on my count. Forty-five, go. Forty-six, go. Forty-seven, go. Forty-eight is the special. Hold it. Hold it. Forty-eight, go. Forty-nine, go. Fifty, go. Beautiful. Nobody touch anything. Standby sound H, the storm. Standby wind machine. Sound H, go. Wind machine, go. Less wind. Less. That is a hurricane. That is a breeze. Split the difference. Thank you. Standby the trap. Is the trap clear? I need a clear. I have a clear. Trap, go. Standby blackout.
    - 'img "Page 3 of 4. Header right: I-2-3. Character at 4.3 inches from the left edge. Dialogue at 1.3 inches from the left edge. Transition right-aligned. Continues NELL (CONT''D). Footer center: 3."': I-2-3 3 NELL (CONT'D) Standby house lights. Standby the bows, all of it. Blackout, go. Hold. Hold. Bows lights, go. Curtain, go. House lights, go. That's the show. Notes in ten minutes. Somebody get me a coffee. And somebody find me that parasol. Thank you, everyone. Good night. BLACKOUT.
    - 'img "Page 4 of 4. Header right: II-1-4. Act centered. Scene centered. Scene Heading centered. Action at 3.8 inches from the left edge. Character at 4.3 inches from the left edge. Parenthetical at 3.3 inches from the left edge. Dialogue at 1.3 inches from the left edge. Centered Text centered. Footer center: 4."': II-1-4 4 ACT TWO SCENE 1 THE STAGE. OPENING NIGHT. ARLO alone in the wings, holding a parasol. ARLO (to the parasol) Don't let me down. END OF PLAY
