- banner:
  - button "Hide the binder" [pressed]
  - button "The Weight of Water"
  - tablist "What this pane shows":
    - tab "Script" [selected]
    - tab "Board"
    - tab "Outline"
    - tab "Cast"
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Hide the inspector" [pressed]
- navigation "Binder":
  - text: The Weight of Water
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "The Weight of Water Rename “The Weight of Water” Actions for “The Weight of Water”" [level=1] [selected]:
      - text: The Weight of Water
      - button "Rename “The Weight of Water”"
      - button "Actions for “The Weight of Water”"
    - group "Scenes in The Weight of Water":
      - treeitem "SCENE 1 1" [level=2]
      - treeitem "SCENE 2 1–2" [level=2]
      - treeitem "SCENE 1 2" [level=2] [selected]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters":
      - treeitem "Mara" [level=2]
      - treeitem "Jonah" [level=2]
    - treeitem "Research" [expanded] [level=1]
    - group "Research":
      - treeitem "1953 North Sea Flood" [level=2]
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes":
      - treeitem "Structure" [level=2]
    - treeitem "Loglines" [expanded] [level=1]
    - group "Loglines":
      - treeitem "Logline" [level=2]
  - button "New"
  - text: at the top level
- main "Play":
  - list "Open in this pane":
    - listitem "The Weight of Water":
      - button "The Weight of Water"
      - button "Close The Weight of Water"
    - listitem "Outline":
      - button "Outline"
  - button "Add a surface to this pane"
  - 'button "What this line is: Action"': Action
  - button "Bold": ⌘B
  - button "Italic": ⌘I
  - button "Underline": ⌘U
  - button "Line Break ⇧⏎"
  - button "Page Break ⌘⏎"
  - button "+ Comment ⌘⌥M"
  - button "Comments ⌘⇧C" [pressed]
  - text: Page 2 of 2
  - textbox "Script"
  - 'img "Scene navigation: 2 pages. On screen: <scene>"'
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene"
    - tab "Comments" [selected]
  - button "Open as a pane"
  - heading "0 comments" [level=2]
  - 'button "Filter comments: All Comments"': All Comments
  - paragraph:
    - text: No comments yet. Select a line in the script and press ⌘⌥M, or type
    - code: "[["
    - text: where you want one.
  - list
- contentinfo:
  - button "/dev/sample-vault/The Weight of Water"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: 100%"': 100%
  - button "Zoom in"
- status
- alert
- dialog "Settings":
  - heading "Settings" [level=2]
  - tablist "Settings sections":
    - tab "General"
    - tab "Appearance" [selected]
    - tab "Writing"
    - tab "Formats"
    - tab "Keyboard Shortcuts"
    - tab "Help & Feedback"
    - tab "Privacy"
    - tab "Updates"
    - tab "About"
  - tabpanel "Appearance":
    - heading "Appearance" [level=3]
    - heading "Text" [level=4]
    - text: Text size
    - combobox "Text size":
      - option "100%" [selected]
      - option "125%"
      - option "150%"
      - option "175%"
      - option "200%"
    - paragraph: Applies to menus, panels and buttons. The pages you write on keep their size; to enlarge them, choose View › Zoom In.
    - heading "Accent color" [level=4]
    - radiogroup "Accent color":
      - radio "Gilt" [checked]
      - radio "Velvet"
      - radio "Ink"
      - radio "Iris"
      - radio "Follow Mac"
    - text: Gilt Default
    - paragraph: Used for selections, switches, links and the text cursor.
    - heading "Light and dark" [level=4]
    - text: Appearance
    - 'button "Appearance: Light"': Light
    - paragraph: The pages you write on stay light when the rest of the app is dark.
  - text: Settings are saved on this Mac, not in your plays.
  - button "Done"
  - status
  - alert
