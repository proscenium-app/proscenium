- banner:
  - button "Hide the binder" [pressed]
  - button "The Weight of Water"
  - tablist "What this pane shows":
    - tab "Script" [selected]
    - tab "Board"
    - tab "Outline"
    - tab "Cast"
    - tab "Changes"
  - button "Open another surface in this pane"
  - button "Help & Tutorials"
  - button "Feedback"
  - button "Split side by side"
  - button "Hide the inspector" [pressed]
- navigation "Binder":
  - text: The Weight of Water
  - button "Collapse all folders"
  - searchbox "Filter the binder"
  - tree "Binder items":
    - treeitem "The Weight of Water Rename “The Weight of Water” Actions for “The Weight of Water”" [level=1] [selected]:
      - text: The Weight of Water
      - button "Rename “The Weight of Water”"
      - button "Actions for “The Weight of Water”"
    - group "Scenes in The Weight of Water":
      - treeitem "SCENE 1 1" [level=2]
      - treeitem "SCENE 2 1–2" [level=2]
      - treeitem "SCENE 1 2" [level=2] [selected]
    - treeitem "Characters" [expanded] [level=1]
    - group "Characters":
      - treeitem "Mara" [level=2]
      - treeitem "Jonah" [level=2]
    - treeitem "Research" [expanded] [level=1]
    - group "Research":
      - treeitem "1953 North Sea Flood" [level=2]
    - treeitem "Notes" [expanded] [level=1]
    - group "Notes":
      - treeitem "Structure" [level=2]
    - treeitem "Loglines" [expanded] [level=1]
    - group "Loglines":
      - treeitem "Logline" [level=2]
  - button "New"
  - text: at the top level
- main "Play":
  - list "Open in this pane":
    - listitem "The Weight of Water":
      - button "The Weight of Water"
      - button "Close The Weight of Water"
    - listitem "Outline":
      - button "Outline"
  - button "Add a surface to this pane"
  - 'button "What this line is: Action"': Action
  - button "Bold": ⌘B
  - button "Italic": ⌘I
  - button "Underline": ⌘U
  - button "Line Break ⇧⏎"
  - button "Page Break ⌘⏎"
  - button "+ Comment ⌘⌥M"
  - button "Comments ⌘⇧C" [pressed]
  - text: Page 2 of 2
  - textbox "Script"
  - 'img "Scene navigation: 2 pages. On screen: <scene>"'
- complementary "Inspector":
  - tablist "Inspector":
    - tab "Scene"
    - tab "Comments" [selected]
  - button "Open as a pane"
  - heading "0 comments" [level=2]
  - 'button "Filter comments: All Comments"': All Comments
  - paragraph:
    - text: No comments yet. Select a line in the script and press ⌘⌥M, or type
    - code: "[["
    - text: where you want one.
  - list
- contentinfo:
  - button "/dev/sample-vault/The Weight of Water"
  - text: <save status>
  - button "Zoom out"
  - 'button "Zoom: 100%"': 100%
  - button "Zoom in"
- status
- alert
- dialog "Help & Tutorials":
  - heading "Help & Tutorials" [level=2]
  - text: Six short lessons, building one practice play as you go.
  - 'button "Continue: Write Your First Exchange · Step 1 of 5"'
  - paragraph: In your practice play, at the step where you stopped.
  - list:
    - listitem:
      - button "Write Your First Exchange": Write Your First Exchange Step 1 of 5
    - listitem:
      - button "Format the Script" [expanded]: Format the Script About 3 minutes
      - paragraph: Emphasize words, keep a speech going on a new line, start a new page and try another format.
      - button "Start Tutorial"
      - list:
        - listitem:
          - button "Emphasize a phrase"
        - listitem:
          - button "Stay in the same speech"
        - listitem:
          - button "Start a new page"
        - listitem:
          - button "Choose a format"
    - listitem:
      - button "Arrange Scenes on the Board": Arrange Scenes on the Board Step 3 of 5
    - listitem:
      - button "Characters and Opening Pages": Characters and Opening Pages About 3 minutes
    - listitem:
      - button "Organize Files and Tags": Organize Files and Tags Step 2 of 4
    - listitem:
      - button "Prepare a PDF or Print": Prepare a PDF or Print About 3 minutes
  - button "Saved Practice (13)"
  - button "Start Over in a New Play"
  - button "Reset Progress…"
  - button "Keyboard Shortcuts"
  - button "Send Feedback…"
  - button "Close"
  - status
  - alert
